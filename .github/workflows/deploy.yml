# Builds the site with Vite and publishes dist/ to GitHub Pages on every push to main.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # the Pages sub-path, e.g. /gbunge-web/ (empty with a custom domain)
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # optional: without these the build keeps the posts in the repo and the mail fallback
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_KO_DB: ${{ secrets.NOTION_BLOG_KO_DB }}
          NOTION_BLOG_EN_DB: ${{ secrets.NOTION_BLOG_EN_DB }}
          VITE_SPONSOR_FORM_ENDPOINT: ${{ secrets.VITE_SPONSOR_FORM_ENDPOINT }}
          VITE_SPONSOR_FORM_KEY: ${{ secrets.VITE_SPONSOR_FORM_KEY }}
      # Pages has no rewrites: serve the app for every unknown path so /about etc. load directly
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
